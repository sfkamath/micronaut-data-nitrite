name: Nitrite verification
on:
  push:
    branches: [local_runner]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-java-ci:
    name: "build"
    runs-on: [self-hosted, linux, arm64, java, docker]
    permissions:
      contents: read
      checks: write
    strategy:
      matrix:
        java: ['25']
    env:
      TESTCONTAINERS_RYUK_DISABLED: true
      SONAR_TOKEN_AVAILABLE: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: "🔧 Setup GraalVM CE"
        uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1
        with:
          distribution: 'graalvm'
          java-version: ${{ matrix.java }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: true

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: "❓ Optional setup step"
        run: |
          [ -f ./setup.sh ] && ./setup.sh || [ ! -f ./setup.sh ]

      - name: "🛠 Build with Gradle"
        id: gradle
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          DEVELOCITY_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
          DEVELOCITY_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
          GH_TOKEN_PUBLIC_REPOS_READONLY: ${{ secrets.GH_TOKEN_PUBLIC_REPOS_READONLY }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
        run: |
          ./gradlew check jacocoReport --no-daemon --continue --rerun-tasks --no-build-cache

      - name: "🔎 Run static analysis"
        if: env.SONAR_TOKEN_AVAILABLE == 'true' && matrix.java == '25'
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          DEVELOCITY_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
          DEVELOCITY_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonar --no-parallel --continue

      - name: "📊 Publish Test Report"
        if: always()
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6
        with:
          check_name: Java CI / Test Report (${{ matrix.java }})
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_retries: 'true'

      - name: "📜 Upload binary compatibility check results"
        if: matrix.java == '25'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-compatibility-reports
          path: "**/build/reports/binary-compatibility-*.html"

      - name: "❓ Optional cleanup step"
        run: |
          [ -f ./cleanup.sh ] && ./cleanup.sh || [ ! -f ./cleanup.sh ]
      - name: Retain validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-java-ci-results
          path: |
            **/build/test-results/**
            **/build/reports/tests/**

  verify:
    needs: upstream-java-ci
    runs-on: [self-hosted, linux, arm64, java, docker]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        backend: [all, rocksdb]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1
        with:
          distribution: graalvm
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Select GraalVM with jenv
        run: |
          git clone --depth 1 --branch 0.6.0 https://github.com/jenv/jenv.git "$RUNNER_TEMP/jenv"
          echo "$RUNNER_TEMP/jenv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/jenv/bin/jenv" add "$JAVA_HOME"
          "$RUNNER_TEMP/jenv/bin/jenv" global 25
      - name: Run JVM repository matrix and dedicated tests
        if: matrix.backend == 'all'
        run: |
          jenv exec ./gradlew -PincludeDataTck=true \
            :micronaut-data-nitrite:test \
            :micronaut-jakarta-data-tck:micronaut-nitrite:test \
            :micronaut-doc-examples:micronaut-nitrite-example-groovy:check \
            :micronaut-doc-examples:micronaut-nitrite-example-java:check \
            :micronaut-doc-examples:micronaut-nitrite-example-kotlin:check \
            :micronaut-data-nitrite-native-tests:test --no-daemon
      - name: Compile native verification executable
        run: jenv exec ./gradlew :micronaut-data-nitrite-native-tests:nativeTestCompile -PnativeBackend=${{ matrix.backend }} --no-daemon
      - name: Execute native verification tests
        run: jenv exec ./gradlew :micronaut-data-nitrite-native-tests:nativeCheck -PnativeBackend=${{ matrix.backend }} --no-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: nitrite-verification-results-${{ matrix.backend }}
          path: '**/build/test-results/**'
